name: CI
on:
  push:
  pull_request:
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install
        working-directory: .
        run: npm ci || npm install
      - name: build
        working-directory: .
        run: npm run build
      - name: test
        working-directory: .
        run: npm test
