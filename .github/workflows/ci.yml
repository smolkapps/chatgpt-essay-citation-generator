name: CI
on:
  push:
  pull_request:
jobs:
  node:
    # Studio by default; STUDIO_CI_UBUNTU_LATEST='"ubuntu-latest"' restores hosted CI.
    runs-on: ${{ fromJSON(format(github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '"ubuntu-latest"' || vars.STUDIO_CI_UBUNTU_LATEST || '["self-hosted","macOS","ARM64","studio-macos","studio-run-{0}"]', github.run_id)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: install
        working-directory: .
        run: npm ci || npm install
      - name: build
        working-directory: .
        run: npm run build
      - name: test
        working-directory: .
        run: npm test
